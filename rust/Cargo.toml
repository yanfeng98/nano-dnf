[workspace]
resolver = "2"
members = [
    "music-rs",
    "loadout-rs",
    "records-rs",
    "summary-rs",
    "progress-rs",
    "core-rs",
    "attract-rs",
    "hints-rs",
    "reward-rs",
    "render-rs",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
