<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nano-dnf · 鬼剑士的地下城</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
        --gold: #e3bf72;
        --ink: #eaf1ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 22px 16px 34px;
        background:
          radial-gradient(circle at 50% -10%, rgba(90, 130, 220, 0.22), transparent 60%),
          linear-gradient(#080b14, #05070f 70%);
        color: var(--ink);
      }
      .frame {
        position: relative;
        padding: 10px;
        border-radius: 16px;
        background: linear-gradient(160deg, rgba(226, 191, 114, 0.5), rgba(30, 40, 70, 0.6) 45%, rgba(226, 191, 114, 0.34));
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65);
      }
      #stage {
        display: block;
        width: min(94vw, 960px);
        height: auto;
        border-radius: 9px;
        background: #05070f;
        image-rendering: pixelated;
        touch-action: none;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        background: linear-gradient(#fff3c4, #d9a743);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        font-size: 13px;
        color: rgba(226, 236, 255, 0.6);
      }
      .hint {
        margin: 0;
        max-width: min(94vw, 960px);
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
        color: rgba(226, 236, 255, 0.72);
      }
      kbd {
        display: inline-block;
        min-width: 22px;
        padding: 1px 6px;
        border-radius: 5px;
        border: 1px solid rgba(226, 191, 114, 0.45);
        background: rgba(226, 191, 114, 0.12);
        color: var(--gold);
        font-size: 12px;
        font-family: inherit;
      }
      #status {
        margin: 0;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: rgba(226, 236, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>nano-dnf</h1>
      <span class="tagline">鬼剑士 · 地下城试炼</span>
    </header>
    <div class="frame">
      <canvas id="stage" width="960" height="540"></canvas>
    </div>
    <p class="hint">
      <kbd>←</kbd><kbd>→</kbd> 移动 · <kbd>C</kbd> 跳跃 · <kbd>X</kbd> 普攻 ·
      <kbd>A</kbd>~<kbd>H</kbd>/<kbd>Q</kbd>~<kbd>Y</kbd> 双排技能槽 · <kbd>1</kbd>~<kbd>3</kbd> 选强化 · <kbd>N</kbd> 换种子 · <kbd>B</kbd> 技能编成（拖动图标换槽） ·
      <kbd>P</kbd> 暂停 · <kbd>F3</kbd> 重开 · <kbd>F1</kbd> 帮助 · <kbd>M</kbd> 静音 · <kbd>F2</kbd> 触屏按钮
    </p>
    <p class="hint" id="dungeon-hint">
      清空房间后走到最右侧传送门进入下一层，最后一层击败 Boss 即通关。
      触屏设备会自动显示虚拟按键（也可在地址后加 <code>?touch=1</code> 强制开启）。
    </p>
    <p id="status"></p>
    <script src="./src/core.js"></script>
    <script src="./src/loadout.js"></script>
    <script src="./src/music.js"></script>
    <script src="./src/records.js"></script>
    <script src="./src/render.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
