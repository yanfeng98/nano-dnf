name: Deploy playable build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and stage the playable build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Stage the static site
        run: |
          mkdir -p _site/src _site/assets
          cp index.html _site/index.html
          # Every browser module, so adding a new src/*.js cannot ship a broken site.
          cp src/*.js _site/src/
          cp assets/slayer.png assets/skills.png assets/effects.png assets/favicon.png _site/assets/

      - name: Verify every referenced asset was staged
        run: |
          # A missing script only shows up as a blank page in production, so fail here.
          status=0
          for ref in $(grep -o 'src="\./[^"]*"' _site/index.html | sed 's/^src="\.\///; s/"$//'); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::staged site is missing $ref"
              status=1
            fi
          done
          exit $status

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload the staged site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify the deployed build
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the smoke-test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      # Runs against the URL this repo publishes in its README, so a deploy that
      # silently lags main or 404s a referenced asset turns the workflow red.
      - name: Smoke-test the live build
        env:
          LIVE_URL: https://luyf-lemon-love.space/nano-dnf/
        run: npm run test:live
