name: Deploy playable build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and stage the playable build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Stage the static site
        run: |
          mkdir -p _site/src _site/assets
          cp index.html _site/index.html
          # Every browser module, so adding a new src/*.js cannot ship a broken site.
          cp src/*.js _site/src/
          # Explicit list: assets/ also holds gitignored working references.
          cp assets/slayer.png assets/skills.png assets/effects.png assets/rift.png assets/awakening.png assets/region.png assets/monsters.png assets/forest.png assets/minimap.png assets/ui.png assets/favicon.png _site/assets/
          cp assets/share-card.png _site/assets/
          # 音乐：清单必进（它一定在）；那两首曲子是从客户端拷来的，在了才拷。
          mkdir -p _site/assets/music
          cp assets/music/manifest.json _site/assets/music/
          for f in assets/music/*.ogg; do
            if [ -f "$f" ]; then cp "$f" _site/assets/music/; fi
          done

      - name: Verify every referenced asset was staged
        run: |
          # A missing script only shows up as a blank page in production, so fail here.
          # The sheets the game draws are named in src/main.js rather than in the
          # markup, so read those too - a missing sheet is a skill that draws
          # nothing, which is just as invisible from a green build.
          status=0
          for ref in $(grep -o 'src="\./[^"]*"' _site/index.html | sed 's/^src="\.\///; s/"$//'); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::staged site is missing $ref"
              status=1
            fi
          done
          for ref in $(grep -ho '\./assets/[A-Za-z0-9._-]*' _site/src/*.js | sed 's|^\./||' | sort -u); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::staged site is missing $ref, which the scripts load"
              status=1
            fi
          done
          # 音乐走清单（它按名字去取，所以前面那条 grep 看不见它）：清单说哪几首该在，
          # 就有哪几首必须真的上线 —— 少一首的后果是线上静音，而构建照样绿。
          node -e '
            const manifest = require("./assets/music/manifest.json");
            const fs = require("fs");
            const missing = (manifest.files || []).filter(
              (name) => !fs.existsSync("_site/assets/music/" + name)
            );
            if (missing.length) {
              console.error("::error::staged site is missing music: " + missing.join(", "));
              process.exit(1);
            }
          '
          exit $status

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload the staged site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify the deployed build
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the smoke-test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      # Runs against the URL this repo publishes in its README, so a deploy that
      # silently lags main or 404s a referenced asset turns the workflow red.
      - name: Smoke-test the live build
        env:
          LIVE_URL: https://luyf-lemon-love.space/nano-dnf/
        run: npm run test:live
